<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaaS Top 5 Ranking Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="header-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
          <path d="M4 22h16"></path>
          <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
          <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
          <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
        </svg>
      </div>
      <div>
        <h2 class="card-title">Top 5 Requested Items</h2>
        <p class="card-subtitle">Highest purchase volume this month</p>
      </div>
    </div>

    <ul class="ranking-list">
      <li class="ranking-item" style="--fill: 100%;">
        <span class="rank-badge">1</span>
        <div class="item-info">
          <span class="item-name">Industrial Fertilizer A</span>
          <div class="progress-track"><div class="progress-bar"></div></div>
        </div>
        <span class="item-value">$14,200</span>
      </li>

      <li class="ranking-item" style="--fill: 78%;">
        <span class="rank-badge">2</span>
        <div class="item-info">
          <span class="item-name">Granulated Urea 46%</span>
          <div class="progress-track"><div class="progress-bar"></div></div>
        </div>
        <span class="item-value">$11,050</span>
      </li>

      <li class="ranking-item" style="--fill: 62%;">
        <span class="rank-badge">3</span>
        <div class="item-info">
          <span class="item-name">Orthene 75 SP</span>
          <div class="progress-track"><div class="progress-bar"></div></div>
        </div>
        <span class="item-value">$8,840</span>
      </li>

      <li class="ranking-item" style="--fill: 45%;">
        <span class="rank-badge">4</span>
        <div class="item-info">
          <span class="item-name">Drip Irrigation Kit</span>
          <div class="progress-track"><div class="progress-bar"></div></div>
        </div>
        <span class="item-value">$6,390</span>
      </li>

      <li class="ranking-item" style="--fill: 31%;">
        <span class="rank-badge">5</span>
        <div class="item-info">
          <span class="item-name">Protective Gear Pack</span>
          <div class="progress-track"><div class="progress-bar"></div></div>
        </div>
        <span class="item-value">$4,420</span>
      </li>
    </ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
